<!DOCTYPE html>
<html>
<head>
    <title>Count Assets with MAPI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 1200px;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .error {
            color: #dc3545;
            font-weight: bold;
            margin-top: 10px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            text-align: left;
        }

        input[type="text"] {
            width: calc(100% - 16px);
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 14px;
        }

        button {
            width: 100%;
            background-color: #007bff;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }

        .loading {
            color: #007bff;
            font-weight: bold;
            margin-top: 15px;
        }

        .results {
            margin-top: 20px;
            text-align: left;
        }

        .results h3 {
            margin: 0 0 12px;
            text-align: center;
        }

        .results table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .results th,
        .results td {
            border: 1px solid #dee2e6;
            padding: 8px 12px;
            text-align: left;
        }

        .results th {
            background-color: #e9ecef;
        }

        .results td.count {
            text-align: right;
            font-variant-numeric: tabular-nums;
            width: 120px;
        }

        .results tr.total-row td {
            font-weight: bold;
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Count Assets with MAPI</h2>
        <label for="envId">Enter Environment ID:</label>
        <input type="text" id="envId" placeholder="Environment ID" autocomplete="off">
        <label for="bearerToken">Enter Your Management API Key:</label>
        <input type="text" id="bearerToken" placeholder="Management API Key" autocomplete="off">
        <button id="fetchButton">Count Assets</button>
        <div id="errorContainer" class="error"></div>
        <div id="loadingContainer" class="loading"></div>
        <div id="assetsCount" class="results"></div>
    </div>
    
    <script>
        document.getElementById("fetchButton").addEventListener("click", fetchAllAssets);

        async function fetchWithRetry(url, options, { maxRetries = 6, onRetry } = {}) {
            let attempt = 0;
            while (true) {
                const response = await fetch(url, options);
                if (response.status !== 429 || attempt >= maxRetries) {
                    return response;
                }
                attempt++;
                const retryAfter = response.headers.get("Retry-After");
                const retryAfterSec = retryAfter ? Number(retryAfter) : NaN;
                const waitMs = Number.isFinite(retryAfterSec) && retryAfterSec > 0
                    ? Math.min(retryAfterSec * 1000, 60000)
                    : Math.min(1000 * Math.pow(2, attempt - 1), 30000);
                if (onRetry) onRetry(attempt, waitMs);
                await new Promise(resolve => setTimeout(resolve, waitMs));
            }
        }

        function fetchAllAssets() {
            const envId = document.getElementById('envId').value.trim();
            const bearerToken = document.getElementById('bearerToken').value.trim();
            const errorContainer = document.getElementById("errorContainer");
            const assetsCountContainer = document.getElementById("assetsCount");
            const loadingContainer = document.getElementById("loadingContainer");
            const fetchButton = document.getElementById("fetchButton");

            errorContainer.textContent = "";
            assetsCountContainer.textContent = "";
            loadingContainer.textContent = "";

            if (!envId) {
                errorContainer.textContent = "Error: Environment ID is required.";
                return;
            }
            if (!bearerToken) {
                errorContainer.textContent = "Error: Management API key is required.";
                return;
            }

            let totalAssets = 0;
            let continuationToken = null;
            // Counts only — never store full asset objects
            const extensionCounts = Object.create(null);
            const apiUrl = `https://manage.kontent.ai/v2/projects/${envId}/assets`;

            fetchButton.disabled = true;

            function getExtensionFromUrl(url) {
                if (!url) return "(unknown)";
                // Strip query/hash, then take the segment after the last '.'
                const path = url.split(/[?#]/, 1)[0];
                const lastSlash = path.lastIndexOf("/");
                const fileName = lastSlash >= 0 ? path.slice(lastSlash + 1) : path;
                const lastDot = fileName.lastIndexOf(".");
                if (lastDot < 0 || lastDot === fileName.length - 1) return "(unknown)";
                return fileName.slice(lastDot + 1).toLowerCase();
            }

            function tallyPage(assets) {
                for (let i = 0; i < assets.length; i++) {
                    const ext = getExtensionFromUrl(assets[i].url);
                    extensionCounts[ext] = (extensionCounts[ext] || 0) + 1;
                }
                totalAssets += assets.length;
            }

            function renderResults() {
                const rows = Object.keys(extensionCounts)
                    .sort((a, b) => extensionCounts[b] - extensionCounts[a] || a.localeCompare(b))
                    .map(ext =>
                        `<tr><td>${escapeHtml(ext)}</td><td class="count">${extensionCounts[ext]}</td></tr>`
                    )
                    .join("");

                assetsCountContainer.innerHTML =
                    `<h3>Total assets: ${totalAssets}</h3>` +
                    `<table>` +
                    `<thead><tr><th>Extension</th><th class="count">Count</th></tr></thead>` +
                    `<tbody>${rows}` +
                    `<tr class="total-row"><td>Total</td><td class="count">${totalAssets}</td></tr>` +
                    `</tbody></table>`;
            }

            function escapeHtml(text) {
                const el = document.createElement("span");
                el.textContent = text;
                return el.innerHTML;
            }

            function fetchPageOfData() {
                loadingContainer.textContent = `Fetching assets... ${totalAssets} so far`;
                const headers = {
                    Authorization: `Bearer ${bearerToken}`,
                    'Content-Type': 'application/json',
                };
                
                if (continuationToken) {
                    headers['x-continuation'] = continuationToken;
                }

                fetchWithRetry(apiUrl, { method: 'GET', headers }, {
                    onRetry: (attempt, waitMs) => {
                        loadingContainer.textContent =
                            `Rate limited (429). Retry ${attempt}/6 in ${Math.ceil(waitMs / 1000)}s... (${totalAssets} so far)`;
                    }
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! Status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    tallyPage(data.assets || []);
                    continuationToken = data.pagination?.continuation_token || null;

                    if (continuationToken) {
                        // Yield to the event loop so the UI stays responsive across many pages
                        setTimeout(fetchPageOfData, 0);
                    } else {
                        loadingContainer.textContent = "";
                        fetchButton.disabled = false;
                        renderResults();
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    loadingContainer.textContent = "";
                    fetchButton.disabled = false;
                    errorContainer.textContent = `Error: ${error.message}`;
                });
            }

            fetchPageOfData();
        }
    </script>
</body>
</html>
